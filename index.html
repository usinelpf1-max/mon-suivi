<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon Suivi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("suivi-theme")||"dark"}catch(e){}</script>
<style>
:root{--bg:#1A1D22;--panel:#22262C;--panel2:#2A2F36;--line:#343A43;--tx:#ECEDEF;--mu:#9AA1AC;--track:#30353D;
--ink:#ECEDEF;--on-ink:#1A1D22;--ok:#30A46C;--warn:#E0A42E;--bad:#E5484D;
--kc:#E5484D;--p:#3E7BFA;--c:#E0A42E;--f:#30A46C;--wt:#C9CDD3;--pr:#E0A42E;--acc:#ECEDEF;
--num:'Barlow Condensed','Arial Narrow',sans-serif;--r:10px;--shadow:0 1px 0 rgba(255,255,255,.03) inset}
html[data-theme=light]{--bg:#E9ECEF;--panel:#FFFFFF;--panel2:#F3F5F7;--line:#D6DBE1;--tx:#1B1F24;--mu:#5E6773;--track:#E3E7EB;
--ink:#1B1F24;--on-ink:#FFFFFF;--ok:#238A57;--warn:#B57C0C;--bad:#D93A40;
--kc:#D93A40;--p:#2F6BEF;--c:#C98A0A;--f:#238A57;--wt:#3A414B;--pr:#B57C0C;--acc:#1B1F24;--shadow:0 1px 2px rgba(20,30,40,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Barlow,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--tx);text-decoration-color:var(--mu);text-underline-offset:3px}
a:hover{text-decoration-color:var(--tx)}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:232px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:20px 12px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{font:700 22px/1 var(--num);letter-spacing:.01em;padding:2px 10px 18px;display:flex;align-items:center;gap:10px}
.brand i{display:inline-flex;gap:2px;align-items:center}
.brand i b{display:block;width:5px;border-radius:2px}
.side a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:500;white-space:nowrap}
.side a:hover{background:var(--panel2);color:var(--tx)}
.side a.on{background:var(--panel2);color:var(--tx);box-shadow:inset 3px 0 0 var(--ink)}
.side svg{width:19px;height:19px;flex:none}
.quickadd{margin:14px 0 10px;width:100%;justify-content:center;display:flex;gap:8px;align-items:center}
.sidekc{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:var(--r);font-size:13px;color:var(--mu)}
.sidekc b{color:var(--tx);font:600 18px var(--num)}
.sidefoot{display:flex;justify-content:space-between;align-items:center;padding:10px 6px 0}
.sync{font-size:12.5px;color:var(--mu);display:flex;gap:7px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu);flex:none}
main{flex:1;min-width:0;padding:26px 32px 80px;max-width:1340px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font:700 34px/1 var(--num);margin:0;letter-spacing:.005em}
.vh .sub{color:var(--mu);margin-top:6px;font-size:14px}
.week{display:flex;align-items:center;gap:4px}
.week .wd{display:flex;flex-direction:column;align-items:center;gap:3px;width:46px;padding:6px 0 7px;border-radius:9px;background:none;border:1px solid transparent;color:var(--mu);font-weight:500}
.week .wd span{font-size:11.5px;text-transform:capitalize}
.week .wd b{font:600 19px/1 var(--num);color:var(--tx)}
.week .wd i{display:block;width:22px;height:3px;border-radius:2px;background:var(--track);overflow:hidden}
.week .wd i u{display:block;height:100%;background:var(--kc)}
.week .wd:hover{background:var(--panel2)}
.week .wd.on{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
.week .wd.today span{color:var(--tx);font-weight:700}
.week .wd:disabled{opacity:.35}
.week .arr{padding:6px 8px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:15px;color:var(--tx);margin:0 0 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;min-height:24px}
.card h2 .tools{font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card h2 .tools select{width:auto}
.card h2 a,.card h2 .lnk{font-size:13px;font-weight:500;color:var(--mu)}
.big{font:700 34px/1 var(--num)}
.mid{font:700 24px/1.1 var(--num)}
.mu{color:var(--mu)} .small{font-size:13px}
.good{color:var(--ok)} .warn{color:var(--warn)} .badc{color:var(--bad)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 11px;font:inherit;min-width:0;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
input[type=date],input[type=time]{color-scheme:dark}
html[data-theme=light] input[type=date]{color-scheme:light}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent;padding:9px 16px;background:var(--ink);color:var(--on-ink);font-weight:600;white-space:nowrap;transition:transform .08s}
button:active{transform:translateY(1px)}
button.ghost{background:var(--panel2);border-color:var(--line);color:var(--tx);font-weight:500}
button.ghost:hover{border-color:var(--mu)}
button.danger{background:transparent;border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
button.icon{padding:3px 8px;background:none;color:var(--mu);font-weight:500}
button.icon:hover{color:var(--bad)}
button.link{background:none;padding:0;color:var(--mu);font-weight:500;text-decoration:underline;text-underline-offset:3px}
button.sm{padding:6px 11px;font-size:13px}
button:disabled{opacity:.35;cursor:default}
kbd{font:600 11px var(--num);background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--mu)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:13px;color:var(--mu)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.field{flex:1 1 110px}
.row.q4>.field{flex:1 1 calc(50% - 10px)}
.stack>*+*{margin-top:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mu);font-weight:500;position:sticky;top:0;background:var(--panel)}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow:auto;max-height:420px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line)}
.chart .lab{fill:var(--mu);font-size:12px;font-family:Barlow,system-ui,sans-serif}
.chart [data-tip]{cursor:pointer}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--on-ink);border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600;z-index:70;white-space:nowrap;display:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.track{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .35s}
.mbar{margin-bottom:13px}.mbar:last-child{margin-bottom:0}
.mrow{display:flex;justify-content:space-between;margin-bottom:6px;gap:8px;align-items:baseline}
.mrow b{font:600 18px var(--num)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:0}
/* barre chargée (signature) */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.hero .left .big{font-size:64px;letter-spacing:-.01em}
.hero .left .unit{color:var(--mu);font-size:15px;margin-top:4px}
.bb{position:relative;height:58px;margin:4px 0 10px}
.bb .shaft{position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--track)}
.bb .plates{position:absolute;inset:0;display:flex;gap:3px;align-items:center}
.bb .pl{height:100%;border-radius:5px;min-width:0;transition:width .4s}
.bb .pl.c{height:84%} .bb .pl.f{height:68%}
.bb .over{height:100%;border-radius:5px;background:repeating-linear-gradient(135deg,var(--bad) 0 6px,transparent 6px 10px);opacity:.9}
.bb .tgt{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);border-radius:2px}
.bb .tgt span{position:absolute;top:-20px;transform:translateX(-50%);font-size:12px;color:var(--mu);white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.legend b{font:600 17px var(--num)}
.ringwrap{position:relative;flex:none}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.flex{display:flex;gap:16px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--tx);font-weight:500}
.chip:hover{border-color:var(--mu)}
.chip em{font-style:normal;color:var(--mu);margin-left:4px}
.tabs{display:inline-flex;gap:3px;background:var(--panel2);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tabs button{background:none;color:var(--mu);padding:5px 11px;font-weight:500;font-size:13px}
.tabs button.on{background:var(--panel);color:var(--tx);box-shadow:var(--shadow)}
.seg{display:flex;gap:3px;background:var(--panel2);padding:3px;border-radius:9px;border:1px solid var(--line);flex-wrap:wrap}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none;width:0}
.seg span{display:block;padding:5px 11px;border-radius:6px;color:var(--mu);font-size:13.5px;font-weight:500}
.seg input:checked+span{background:var(--ink);color:var(--on-ink)}
.seg input:focus-visible+span{outline:2px solid var(--p)}
.ac{position:relative}
.acl{position:absolute;left:0;min-width:min(440px,92vw);right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:20;max-height:340px;overflow:auto;box-shadow:0 14px 34px rgba(0,0,0,.35);padding:4px}
.aci{display:flex;justify-content:space-between;gap:14px;padding:8px 10px;cursor:pointer;border-radius:7px}
.aci>span:last-child{white-space:nowrap}
.aci.on,.aci:hover{background:var(--panel2)}
.achead{font-size:12px;color:var(--mu);padding:6px 10px 2px}
.mealhead{display:flex;justify-content:space-between;align-items:center;padding:10px 0 7px;border-bottom:1px solid var(--line);font-weight:600;gap:8px}
.mealgroup{margin-bottom:14px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.entry:last-child{border-bottom:0}
.entry .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.entry .kc{font:600 17px var(--num);min-width:72px;text-align:right}
.qbtn{background:none;border:1px dashed transparent;color:var(--mu);padding:1px 6px;font-weight:400;font-size:13px}
.qbtn:hover{border-color:var(--line);color:var(--tx)}
.qedit{width:74px;padding:4px 7px;font-size:13px}
.empty{color:var(--mu);padding:26px 12px;text-align:center;font-size:14px}
.empty button{margin-top:10px}
.note{background:var(--panel2);border-left:3px solid var(--ok);padding:10px 13px;border-radius:6px;color:var(--mu);font-size:14px}
.note.w{border-color:var(--warn)}
.stat .lbl{font-size:13px;color:var(--mu)}
.stat .val{font:700 28px/1.1 var(--num);margin-top:4px}
.ex{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.ex .sets{display:grid;grid-template-columns:24px minmax(70px,1fr) 1fr 1fr 28px;gap:6px;align-items:center;margin-top:8px}
.ex .sets input{padding:7px 9px}
.prev{background:none;border:1px dashed var(--line);color:var(--mu);padding:6px 4px;font-size:13px;font-weight:500;border-radius:7px}
.prev:hover{color:var(--tx);border-color:var(--mu)}
.prev.none{border-color:transparent;cursor:default}
.hint{font-size:13px;color:var(--mu);margin-top:6px;min-height:18px}
.hint b{color:var(--tx);font-weight:600}
.sess{border-bottom:1px solid var(--line);padding:11px 0}
.sess:last-child{border-bottom:0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mu);margin-left:6px}
.tag.pr{color:var(--pr);border-color:color-mix(in srgb,var(--pr) 45%,transparent)}
.goalcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gc{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--tx);font-weight:400;white-space:normal;display:flex;flex-direction:column;gap:5px}
.gc b{font-size:15px}
.gc .k{font:700 26px/1 var(--num);margin-top:8px}
.gc.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.gc .small{color:var(--mu)}
.goal{padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.drop{border:2px dashed var(--line);border-radius:14px;padding:32px;text-align:center;color:var(--mu);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--ink);color:var(--tx);background:var(--panel)}
.drop b{color:var(--tx);font-size:16px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{position:relative;border-radius:10px;overflow:hidden;background:var(--panel2);border:2px solid transparent;aspect-ratio:3/4;cursor:zoom-in}
.ph.sel{border-color:var(--ink)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12.5px;display:flex;justify-content:space-between;align-items:flex-end}
.ph .pick{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.4);padding:0;color:#fff;font-size:13px;line-height:22px}
.ph.sel .pick{background:#fff;color:#111}
.ph .rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;padding:1px 7px;border-radius:6px;opacity:0;transition:.15s}
.ph:hover .rm,.ph:focus-within .rm{opacity:1}
.ph .miss{display:flex;align-items:center;justify-content:center;height:100%;color:var(--mu);font-size:12px;padding:10px;text-align:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp img{width:100%;max-height:70vh;object-fit:contain;border-radius:10px;background:#000;display:block}
.modal{position:fixed;inset:0;background:rgba(10,12,15,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(3px)}
.modal.hidden{display:none}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.modal .box p{margin:0 0 14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.lb{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:96vw}
.lb img{max-width:92vw;max-height:80vh;border-radius:10px;display:block}
.lb .nav{display:flex;gap:10px;align-items:center;color:#fff}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--on-ink);padding:10px 10px 10px 16px;border-radius:10px;opacity:0;transition:.22s;pointer-events:none;z-index:60;display:flex;gap:12px;align-items:center;font-weight:500;box-shadow:0 10px 28px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast button{background:transparent;color:var(--on-ink);border:1px solid color-mix(in srgb,var(--on-ink) 35%,transparent)}
details summary{cursor:pointer;color:var(--mu);font-size:14px}
body.locked .app{display:none}
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);z-index:80;overflow:auto}
#lock[hidden]{display:none}
.lockbox{width:100%;max-width:410px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
.fab{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:1050px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}.goalcards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr;gap:12px}}
@media(max-width:860px){
.app{flex-direction:column}
.side{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:30}
.brand,.sidekc,.sidefoot,.quickadd{display:none}
.side a{flex-direction:column;gap:2px;padding:6px 4px;font-size:11px;flex:1;justify-content:center}
.side a span{display:block;max-width:64px;overflow:hidden;text-overflow:ellipsis}
.side a.on{box-shadow:inset 0 2px 0 var(--ink)}
.side a.hm{display:none}
main{padding:16px 14px 96px}
h1{font-size:28px}
.g2,.g3,.g4,.cmp{grid-template-columns:1fr}
.entry .small.n{display:none}
.kb{display:none}
.week .wd{width:40px}
.hero .left .big{font-size:52px}
.fab{display:flex;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;width:54px;height:54px;border-radius:50%;padding:0;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div id="lock" hidden></div>
<button class="fab" data-act="quick" aria-label="Ajouter un aliment">+</button>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<div id="tip"></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<script>
'use strict';
/* ================= utilitaires ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const num = v => { if (v == null || v === '') return null; const n = parseFloat(String(v).replace(',', '.').replace(/\s/g, '')); return isFinite(n) ? n : null; };
const r1 = n => Math.round(n * 10) / 10;
const fmt = (n, d = 0) => (n == null || !isFinite(n)) ? '–' : Number(n).toLocaleString('fr-FR', {maximumFractionDigits: d});
const sgn = (n, d = 1) => (n == null || !isFinite(n)) ? '–' : (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n), d);
const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const norm = s => String(s || '').toLowerCase().replace(/œ/g, 'oe').replace(/æ/g, 'ae').normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const pad2 = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };

function barbell(t, T) {
  const pk = t.p * 4, ck = t.c * 4, fk = t.f * 9, sum = pk + ck + fk, k = sum > t.kcal && sum ? t.kcal / sum : 1;
  let other = Math.max(0, t.kcal - sum * k); if (other < t.kcal * 0.03) other = 0; const max = Math.max(T.kcal * 1.12, t.kcal * 1.03), w = v => (v / max * 100).toFixed(2);
  const pl = (v, cls, col, lbl) => v > 0 ? `<div class="pl ${cls}" style="width:calc(${w(v)}% - 3px);background:${col}" data-tip="${lbl} : ${fmt(v)} kcal"></div>` : '';
  return `<div class="bb" role="img" aria-label="${fmt(t.kcal)} kcal sur ${fmt(T.kcal)}"><div class="shaft"></div><div class="plates">${pl(pk * k, 'p', 'var(--p)', 'Protéines')}${pl(ck * k, 'c', 'var(--c)', 'Glucides')}${pl(fk * k, 'f', 'var(--f)', 'Lipides')}${pl(other, 'f', 'var(--mu)', 'Sans détail')}</div><div class="tgt" style="left:${w(T.kcal)}%"><span>cible ${fmt(T.kcal)}</span></div></div>`;
}

/* autocomplétion */
let acItems = [], acIdx = -1, acRecent = false;
function acUpdate() {
  const fi = $('#foodIn'), box = $('#acList'); if (!fi || !box) return;
  const q = norm(fi.value);
  if (document.activeElement !== fi) { box.hidden = true; acItems = []; return; }
  if (!q) { acItems = recentFoods().slice(0, 6); acRecent = true; if (!acItems.length) { box.hidden = true; return; } acIdx = -1; acPaint(); return; }
  acRecent = false;
  const sc = f => { const n = norm(f.name); return n.startsWith(q) ? 0 : n.split(/[\s'’-]+/).some(w => w.startsWith(q)) ? 1 : n.includes(q) ? 2 : 9; };
  acItems = S.settings.foods.map(f => [sc(f), f]).filter(a => a[0] < 9).sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name, 'fr')).slice(0, 8).map(a => a[1]);
  if (acItems.length === 1 && norm(acItems[0].name) === q) { box.hidden = true; return; }
  acIdx = acItems.length ? 0 : -1; acPaint();
}
function acPaint() {
  const box = $('#acList'); if (!box) return;
  box.innerHTML = (acRecent ? '<div class="achead">Récents</div>' : '') + (acItems.length ? acItems.map((f, i) => `<div class="aci ${i === acIdx ? 'on' : ''}" data-aci="${i}"><span>${esc(f.name)}</span><span class="small mu">${fmt(f.kcal)} kcal/100 g${f.unitGrams ? ` · ${esc(f.unitLabel || 'unité')} ${fmt(f.unitGrams)} g` : ''}</span></div>`).join('')
    : `<div class="aci small mu" data-aci="-1">Aucun aliment trouvé. Ajoute-le dans « Mes aliments » (page Repas) ou utilise la saisie manuelle.</div>`);
  box.hidden = false;
}
function fillFood(f) { $('#foodIn').value = f.name; const b = $('#acList'); if (b) b.hidden = true; updatePreview(); const u = lastUse(f.id), q = $('#qtyIn'); if (u) { q.value = u.qty; const us = $('#unitIn'); if ([...us.options].some(o => o.value === u.unit)) us.value = u.unit; updatePreview(); } q.focus(); q.select(); }
function acPick(i) { const f = acItems[i]; if (f) fillFood(f); }
function updatePreview() {
  const fi = $('#foodIn'), us = $('#unitIn'), q = $('#qtyIn'), pv = $('#preview'); if (!fi || !us) return;
  const f = findFood(fi.value), sig = f ? f.id : '';
  if (us.dataset.sig !== sig) {
    us.dataset.sig = sig;
    us.innerHTML = f && f.unitGrams ? `<option value="u">${esc(f.unitLabel || 'unité')} (${fmt(f.unitGrams)} g)</option><option value="g">grammes</option>` : '<option value="g">grammes</option>';
    if (f) q.value = f.unitGrams ? '1' : '100';
  }
  if (!f) { pv.innerHTML = '&nbsp;'; return; }
  const e = entryFromFood(f, num(q.value), us.value);
  pv.innerHTML = e ? `≈ <b style="color:var(--tx)">${fmt(e.kcal)} kcal</b> · P ${fmt(e.p, 1)} · G ${fmt(e.c, 1)} · L ${fmt(e.f, 1)} g` : '&nbsp;';
}

function vCorps() {

async function hydratePhotos() {

}

async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  } finally { URL.revokeObjectURL(url); }
}
async function uploadFiles(files) {

  for (let i = 0; i < files.length; i++) {
    uploading = `Envoi ${i + 1} / ${files.length}…`; if (view === 'photos') render();
    try {
      const blob = await shrink(files[i]);
      if (!blob) throw {code: 'decode'};

      phCache.set(id, URL.createObjectURL(blob));
      S.photos.items.push({id, date: cur, angle: photoAngle, added: Date.now()}); touch('photos'); ok++;
    } catch (e) {

      if (e && e.status === 401) { setSync('auth'); break; }
      if (navigator.onLine === false) { toast('Hors ligne : réessaie avec du réseau'); break; }
    }
  }
  uploading = ''; render();
  toast(bad ? `${ok} photo(s) ajoutée(s), ${bad} refusée(s)${files.some(f => /heic/i.test(f.name + f.type)) ? ' (HEIC : exporte-les en JPG)' : ''}` : `${ok} photo${ok > 1 ? 's' : ''} ajoutée${ok > 1 ? 's' : ''}`);
}

const RENDER = {accueil: vAccueil, repas: vRepas, corps: vCorps, seances: vSeances, photos: vPhotos, objectifs: vObjectifs, donnees: vDonnees};
function render() {
  let h = location.hash.slice(1); if (ALIAS[h]) h = ALIAS[h];
  view = RENDER[h] ? h : 'accueil';
  const y = window.scrollY, a = document.activeElement, foc = a && a.id, lib = $('#libDetails');
  const libOpen = lib ? lib.open : null;
  renderSide();
  $('#main').innerHTML = RENDER[view]();
  if (libOpen != null && $('#libDetails')) $('#libDetails').open = libOpen || $('#libDetails').open;
  if ($('#foodIn')) updatePreview();
  window.scrollTo(0, y);
  if (foc === 'foodFilter' && $('#foodFilter')) { const f = $('#foodFilter'); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  $('#tip').style.display = 'none';
  if (view === 'photos') hydratePhotos();
  if (focusFood && $('#foodIn')) { focusFood = false; $('#foodIn').focus(); }
}
let focusFood = false;

/* ================= dialogues ================= */
function ask(msg, okLabel = 'Confirmer', withInput = null) {
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = `<div class="box"><p>${esc(msg)}</p>${withInput != null ? `<input id="askIn" value="${esc(withInput)}">` : ''}<div class="acts"><button class="ghost" id="askNo">Annuler</button><button id="askOk" class="${withInput == null ? 'danger' : ''}">${esc(okLabel)}</button></div></div>`;
    m.classList.remove('hidden');
    const done = v => { m.classList.add('hidden'); m.innerHTML = ''; document.removeEventListener('keydown', key, true); res(v); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(null); } };
    document.addEventListener('keydown', key, true);
    $('#askNo').onclick = () => done(null);
    $('#askOk').onclick = () => done(withInput != null ? ($('#askIn').value.trim() || null) : true);
    m.onclick = e => { if (e.target === m) done(null); };
    const inp = $('#askIn'); if (inp) { inp.focus(); inp.select(); inp.onkeydown = e => { if (e.key === 'Enter') $('#askOk').click(); }; } else $('#askOk').focus();
  });
}
let toastT;
function toast(msg, undo) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button class="ghost sm" id="undoBtn">Annuler</button>' : ''}`;
  t.classList.add('show'); t.style.pointerEvents = undo ? 'auto' : 'none';
  if (undo) $('#undoBtn').onclick = () => { undo(); t.classList.remove('show'); t.style.pointerEvents = 'none'; };
  clearTimeout(toastT); toastT = setTimeout(() => { t.classList.remove('show'); t.style.pointerEvents = 'none'; }, undo ? 6000 : 2400);
}
function exportText() { const days = {}; for (const k in S.days) if (!isEmptyDay(S.days[k])) days[k] = S.days[k]; return JSON.stringify({app: 'mon-suivi', version: 2, date: todayKey(), settings: S.settings, days, photos: S.photos}); }
function removeWithUndo(arr, pred, key, msg) { const i = arr.findIndex(pred); if (i < 0) return; const [it] = arr.splice(i, 1); if (it && it.id) deletedIds.add(it.id); touch(key); render(); toast(msg, () => { if (it && it.id) deletedIds.delete(it.id); arr.splice(i, 0, it); touch(key); render(); }); }

/* ================= actions ================= */
const ACT = {
  day: el => { let n = addDays(cur, +el.dataset.n); if (n > todayKey()) n = todayKey(); cur = n; render(); },
  today: () => { cur = todayKey(); render(); },
  mode: el => { addMode = el.dataset.m; if (view !== 'repas') location.hash = 'repas'; else render(); },
  chip: el => { const f = S.settings.foods.find(x => x.id === el.dataset.id); if (f && $('#foodIn')) fillFood(f); },
  quick: () => { if ($('#foodIn')) { $('#foodIn').scrollIntoView({block: 'center'}); $('#foodIn').focus(); } else { focusFood = true; addMode = 'food'; location.hash = 'repas'; } },
  theme: () => { const n = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = n; try { localStorage.setItem('suivi-theme', n); } catch (e) {} render(); },
  goday: el => { cur = el.dataset.k; render(); },
  usePrev: el => { const e = draft.ex[+el.dataset.i], s = e && e.sets[+el.dataset.j]; if (!s) return; s.r = el.dataset.r; s.kg = el.dataset.kg; saveDraft(); render(); },
  delMeal: el => { const d = day(cur); removeWithUndo(d.meals, e => e.id === el.dataset.id, cur, 'Aliment supprimé'); },
  editQty: el => {
    const d = day(cur), e = d.meals.find(x => x.id === el.dataset.id); if (!e) return;
    const inp = document.createElement('input'); inp.className = 'qedit'; inp.inputMode = 'decimal'; inp.value = e.unit === 'u' ? e.qty : (e.grams || e.qty);
    el.replaceWith(inp); inp.focus(); inp.select();
    let done = false;
    const commit = ok => {
      if (done) return; done = true; const q = num(inp.value);
      if (ok && q && q > 0) {
        const f = S.settings.foods.find(x => x.id === e.foodId);
        if (f) { const ne = entryFromFood(f, q, e.unit); Object.assign(e, ne, {id: e.id, meal: e.meal}); }
        else { const old = e.unit === 'u' ? e.qty : (e.grams || e.qty), k = q / old; ['kcal', 'p', 'c', 'f'].forEach(m => e[m] = m === 'kcal' ? Math.round(e[m] * k) : r1(e[m] * k)); if (e.unit === 'u') e.qty = q; else { e.grams = q; e.qty = q; } }
        touch(cur);
      }
      render();
    };
    inp.onkeydown = ev => { if (ev.key === 'Enter') commit(true); if (ev.key === 'Escape') commit(false); };
    inp.onblur = () => commit(true);
  },
  copyYesterday: () => { const y = peek(addDays(cur, -1)); if (!y) return; day(cur).meals.push(...y.meals.map(e => ({...clone(e), id: newId()}))); touch(cur); render(); toast("Repas d'hier copiés"); },
  saveTpl: async el => {
    const mk = el.dataset.meal, items = day(cur).meals.filter(e => e.meal === mk); if (!items.length) return;
    const name = await ask('Nom du repas type :', 'Enregistrer', (MEALS.find(m => m[0] === mk) || [, ''])[1] + ' habituel'); if (!name) return;
    S.settings.templates.push({id: newId(), name, meal: mk, items: items.map(e => { const c = clone(e); delete c.id; delete c.meal; return c; })});
    touch('settings'); render(); toast('Repas type enregistré');
  },
  useTpl: el => { const tp = S.settings.templates.find(t => t.id === el.dataset.id); if (!tp) return; day(cur).meals.push(...tp.items.map(e => ({...clone(e), id: newId(), meal: tp.meal || lastMeal}))); touch(cur); render(); toast(`${tp.name} ajouté`); },
  delTpl: el => removeWithUndo(S.settings.templates, t => t.id === el.dataset.id, 'settings', 'Repas type supprimé'),
  editFood: el => { editFoodId = el.dataset.id; render(); const f = document.querySelector('[data-form=saveFood] input[name=name]'); if (f) { f.scrollIntoView({block: 'center'}); f.focus(); } },
  cancelFood: () => { editFoodId = null; render(); },
  delFood: el => { if (editFoodId === el.dataset.id) editFoodId = null; removeWithUndo(S.settings.foods, x => x.id === el.dataset.id, 'settings', 'Aliment supprimé de ta liste'); },
  delBody: el => { const k = el.dataset.k, d = day(k), old = d.body; d.body = null; deletedIds.add('body:' + k); touch(k); render(); toast('Mesures supprimées', () => { deletedIds.delete('body:' + k); day(k).body = old; touch(k); render(); }); },
  prMode: el => { prMode = el.dataset.m; render(); },
  wAddEx: () => { draft.ex.push({n: '', sets: [{r: '', kg: ''}]}); saveDraft(); render(); const ins = document.querySelectorAll('[data-wf=n]'); if (ins.length) ins[ins.length - 1].focus(); },
  wDelEx: el => { draft.ex.splice(+el.dataset.i, 1); if (!draft.ex.length) draft.ex.push({n: '', sets: [{r: '', kg: ''}]}); saveDraft(); render(); },
  wAddSet: el => { const i = +el.dataset.i, e = draft.ex[i], l = e.sets[e.sets.length - 1]; e.sets.push(l ? {...l} : {r: '', kg: ''}); saveDraft(); render(); const ins = document.querySelectorAll(`[data-wx="${i}"][data-wf=r]`); if (ins.length) ins[ins.length - 1].focus(); },
  wDelSet: el => { const e = draft.ex[+el.dataset.i]; e.sets.splice(+el.dataset.j, 1); if (!e.sets.length) e.sets.push({r: '', kg: ''}); saveDraft(); render(); },
  wReset: () => { const old = draft; draft = newDraft(); saveDraft(); render(); toast('Séance vidée', () => { draft = old; saveDraft(); render(); }); },
  wSave: () => {
    const ex = draft.ex.map(e => ({n: e.n.trim(), sets: e.sets.filter(s => num(s.r) != null).map(s => ({r: num(s.r), kg: num(s.kg) || 0}))})).filter(e => e.n && e.sets.length);
    if (!ex.length) { toast('Ajoute au moins un exercice avec une série'); return; }
    const prs = ex.filter(e => { const b = bestFor(e.n), m = Math.max(...e.sets.map(s => s.kg)); return m > 0 && (!b || m > b.kg); }).filter(e => bestFor(e.n)).map(e => e.n);
    day(cur).workouts.push({id: newId(), place: draft.place, name: draft.name.trim(), dur: num(draft.dur), note: draft.note.trim(), ex, prs});
    touch(cur); draft = newDraft(); saveDraft(); render();
    toast(prs.length ? `Séance enregistrée · nouveau PR : ${prs.join(', ')} 🔥` : 'Séance enregistrée 💪');
  },
  wDelSession: el => { const d = day(el.dataset.k); removeWithUndo(d.workouts, w => w.id === el.dataset.id, el.dataset.k, 'Séance supprimée'); },
  setGoal: el => { S.settings.profile.goal = el.dataset.g; touch('settings'); render(); toast(`Objectif : ${GOALS[el.dataset.g][0]} · ${fmt(calc().kcal)} kcal/jour`); },
  delGoal: el => removeWithUndo(S.settings.goals, g => g.id === el.dataset.id, 'settings', 'Objectif supprimé'),
  pickFiles: () => { if (TOKEN && !uploading) $('#fileIn').click(); },
  phOpen: (el, e) => { if (e.target.closest('.pick,.rm')) return; openLightbox(el.dataset.id); },
  phPick: el => { const id = el.dataset.id; photoSel = photoSel.includes(id) ? photoSel.filter(x => x !== id) : [...photoSel, id].slice(-2); render(); if (photoSel.length === 2) window.scrollTo({top: 0, behavior: 'smooth'}); },
  phClear: () => { photoSel = []; render(); },
  phDel: async el => {
    if (!await ask('Supprimer cette photo pour de bon ?', 'Supprimer')) return;
    const id = el.dataset.id;
    try { await delFile('photos/' + id + '.enc', 'Suppression photo'); } catch (e) { toast('Suppression impossible pour le moment'); return; }
    deletedPhotos.add(id); S.photos.items = S.photos.items.filter(p => p.id !== id); photoSel = photoSel.filter(x => x !== id); touch('photos'); render(); toast('Photo supprimée');
  },
  lock: () => lockNow(),
  syncNow: async () => { await pull(true); flush(); if (view === 'donnees') render(); toast(sync === 'ok' ? 'À jour' : 'Synchro en cours…'); },
  newToken: async () => { const t = await ask('Colle le nouveau jeton GitHub :', 'Enregistrer', ''); if (!t) return; try { await changeToken(t.trim()); render(); toast('Jeton mis à jour'); } catch (e) { toast(typeof e === 'string' ? e : 'Jeton refusé'); } },
  forget: async () => { if (!await ask("Oublier cet appareil ? Tes données restent dans le dépôt GitHub, il faudra remettre le jeton et le mot de passe.", 'Oublier')) return; forgetDevice(); },
  showExport: () => { const b = $('#exportBox'); b.style.display = 'block'; b.value = exportText(); b.focus(); b.select(); },
  copyExport: async () => { const t = exportText(); try { await navigator.clipboard.writeText(t); toast('Sauvegarde copiée'); } catch (e) { const b = $('#exportBox'); b.style.display = 'block'; b.value = t; b.select(); toast('Copie bloquée : sélectionne le texte et fais Ctrl+C'); } },
  doImport: async () => {
    let o; try { o = JSON.parse($('#importBox').value); } catch (e) { toast('Texte invalide'); return; }
    if (!o || (!o.settings && !o.days)) { toast("Ce n'est pas une sauvegarde"); return; }
    if (!await ask('Remplacer tes données actuelles par cette sauvegarde ?', 'Restaurer')) return;
    const old = Object.keys(S.days);
    S.settings = normSettings(o.settings); S.days = {}; for (const k in (o.days || {})) if (isKey(k)) S.days[k] = normDay(o.days[k]);
    old.forEach(k => { if (!S.days[k]) S.days[k] = normDay(); markDirty(k); }); Object.keys(S.days).forEach(k => markDirty(k));
    touch('settings'); render(); toast('Sauvegarde restaurée');
  },
  reset: async () => {
    if (!await ask('Effacer définitivement toutes tes données ? Impossible à annuler.', 'Tout effacer')) return;
    const keys = Object.keys(S.days); S = {settings: normSettings(), days: {}, photos: S.photos}; keys.forEach(k => { S.days[k] = normDay(); markDirty(k); });
    touch('settings'); render(); toast('Données effacées (les photos restent dans la section Photos)');
  }
};
const FORMS = {
  addFood: fd => {
    const f = findFood(fd.get('food')); if (!f) { toast('Choisis un aliment dans la liste'); return; }
    const e = entryFromFood(f, num(fd.get('qty')), fd.get('unit')); if (!e) { toast('Quantité invalide'); return; }
    e.meal = lastMeal = fd.get('meal') || lastMeal; day(cur).meals.push(e); touch(cur); render();
    toast(`${f.name} ajouté · ${fmt(e.kcal)} kcal`, () => { const d = day(cur); deletedIds.add(e.id); d.meals = d.meals.filter(x => x.id !== e.id); touch(cur); render(); });
    const fi = $('#foodIn'); if (fi) fi.focus();
  },
  addManual: fd => {
    const kcal = num(fd.get('kcal')); if (kcal == null) { toast('Indique les calories'); return; }
    lastMeal = fd.get('meal') || lastMeal;
    day(cur).meals.push({id: newId(), meal: lastMeal, name: String(fd.get('name')).trim(), kcal: Math.round(kcal), p: num(fd.get('p')) || 0, c: num(fd.get('c')) || 0, f: num(fd.get('f')) || 0});
    touch(cur); render(); toast('Ajouté');
  },
  saveFood: fd => {
    const name = String(fd.get('name')).trim(), kcal = num(fd.get('kcal')); if (!name || kcal == null) return;
    const id = fd.get('id'), dup = S.settings.foods.find(x => norm(x.name) === norm(name) && x.id !== id);
    if (dup) { toast('Un aliment porte déjà ce nom'); return; }
    const o = {id: id || 'u' + newId(), name, kcal, p: num(fd.get('p')) || 0, c: num(fd.get('c')) || 0, f: num(fd.get('f')) || 0, unitLabel: String(fd.get('unitLabel') || '').trim(), unitGrams: num(fd.get('unitGrams'))};
    if (id) S.settings.foods = S.settings.foods.map(x => x.id === id ? o : x); else S.settings.foods.push(o);
    editFoodId = null; touch('settings'); render(); toast(id ? 'Aliment modifié' : 'Aliment ajouté');
  },
  saveBody: fd => {
    const b = {}; METRICS.forEach(([k]) => { const v = num(fd.get(k)); if (v != null && v > 0) b[k] = v; });
    day(cur).body = Object.keys(b).length ? b : null; touch(cur); render(); toast('Mesures enregistrées');
  },
  saveTarget: fd => {
    const p = S.settings.profile; p.goalWeight = num(fd.get('goalWeight')); p.goalWaist = num(fd.get('goalWaist')); const d = fd.get('goalDate'); p.goalDate = isKey(d) ? d : null;
    touch('settings'); render(); toast('Cible enregistrée');
  },
  addGoal: fd => {
    const type = fd.get('type'), target = num(fd.get('target')); if (target == null) { toast('Indique une valeur visée'); return; }
    const g = {id: newId(), type, target, date: isKey(fd.get('date')) ? fd.get('date') : null};
    if (type === 'pr') { g.ex = String(fd.get('ex') || '').trim(); if (!g.ex) return; const s = prSeries(g.ex, 'kg'); g.start = s.best || 0; }
    if (type === 'poids') g.start = weightNow();
    if (type === 'taille') { const w = metricSeries('waist'); g.start = w.length ? w[w.length - 1].y : null; }
    if (type === 'autre') { g.name = String(fd.get('name') || '').trim(); g.unit = String(fd.get('unit') || '').trim(); g.cur = num(fd.get('cur')); g.start = g.cur ?? 0; }
    S.settings.goals.push(g); touch('settings'); render(); toast('Objectif ajouté');
  },
  saveProfile: fd => {
    const p = S.settings.profile;
    p.name = String(fd.get('name') || '').trim(); p.sex = fd.get('sex'); p.age = num(fd.get('age')) || p.age; p.height = num(fd.get('height')) || p.height;
    p.weight = num(fd.get('weight')) || p.weight; p.steps = fd.get('steps') || 'lt4'; p.sessions = num(fd.get('sessions')) ?? 0; p.dur = num(fd.get('dur')) ?? 0;
    ['kcal', 'p', 'c', 'f'].forEach(k => { S.settings.overrides[k] = num(fd.get('o_' + k)); });
    p.tdee = num(fd.get('tdee')); p.goalKcal = {}; p.goalProt = {}; Object.keys(GOALS).forEach(k => { p.goalKcal[k] = num(fd.get('gk_' + k)); p.goalProt[k] = num(fd.get('gp_' + k)); });
    touch('settings'); render(); toast('Profil enregistré');
  }
};

/* ================= événements ================= */
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault(); const f = ACT[el.dataset.act]; if (f) f(el, e); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); const h = FORMS[f.dataset.form]; if (h) h(new FormData(f)); });
document.addEventListener('mousedown', e => { const it = e.target.closest('.aci'); if (it) { e.preventDefault(); const i = +it.dataset.aci; if (i >= 0) acPick(i); } });
let goalT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'foodIn') { acUpdate(); updatePreview(); }
  else if (t.closest('form[data-form=addFood]')) updatePreview();
  if (t.id === 'foodFilter') { foodFilter = t.value; render(); return; }
  if (t.dataset.w) { draft[t.dataset.w] = t.value; saveDraft(); }
  if (t.dataset.wx != null) {
    const i = +t.dataset.wx, ex = draft.ex[i]; if (!ex) return;
    if (t.dataset.ws != null) { const s = ex.sets[+t.dataset.ws]; if (s) s[t.dataset.wf] = t.value; } else { ex.n = t.value; const h = $('#hint' + i); if (h) h.innerHTML = hintFor(t.value); }
    saveDraft();
  }
  if (t.id === 'prNotes') { S.settings.prNotes = t.value; const ps = $('#prSaved'); if (ps) ps.textContent = 'Enregistrement…'; clearTimeout(goalT); goalT = setTimeout(() => { touch('settings'); const q = $('#prSaved'); if (q) q.textContent = 'Enregistré'; }, 800); }
  if (t.dataset.goalcur) { const g = S.settings.goals.find(x => x.id === t.dataset.goalcur); if (g) { g.cur = num(t.value); clearTimeout(goalT); goalT = setTimeout(() => { touch('settings'); }, 600); } }
});
document.addEventListener('focusout', e => { if (e.target.dataset && e.target.dataset.goalcur) render(); if (e.target.id === 'foodIn') setTimeout(() => { const b = $('#acList'); if (b && document.activeElement !== $('#foodIn')) b.hidden = true; }, 120); });
document.addEventListener('focusin', e => { if (e.target.id === 'foodIn') acUpdate(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'curDate' && isKey(t.value)) { cur = t.value > todayKey() ? todayKey() : t.value; render(); }
  else if (t.id === 'bodyMetric') { bodyMetric = t.value; render(); }
  else if (t.id === 'bodyRange') { bodyRange = +t.value; render(); }
  else if (t.id === 'prEx') { prEx = t.value; render(); }
  else if (t.id === 'gType') { gType = t.value; render(); }
  else if (t.id === 'phFilter') { photoFilter = t.value; render(); }
  else if (t.name === 'angle') { photoAngle = t.value; }
  else if (t.name === 'meal' && t.type === 'radio') { lastMeal = t.value; }
  else if (t.id === 'unitIn') updatePreview();
  else if (t.dataset.wf === 'n') render();
  else if (t.id === 'fileIn') { const fs = t.files; if (fs && fs.length) uploadFiles(fs); t.value = ''; }
  else if (t.id === 'wLoad' && t.value) {
    const [k, id] = t.value.split('|'), w = (peek(k) || {workouts: []}).workouts.find(x => x.id === id); if (!w) return;
    draft = {place: w.place, name: w.name || '', dur: w.dur != null ? String(w.dur) : '', note: '', ex: w.ex.map(x => ({n: x.n, sets: x.sets.map(s => ({r: String(s.r), kg: s.kg ? String(s.kg) : ''}))}))};
    saveDraft(); render(); toast('Séance chargée : ajuste les charges puis enregistre');
  }
});
document.addEventListener('keydown', e => {
  const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  if (t && t.id === 'foodIn') {
    const box = $('#acList'), open = box && !box.hidden && acItems.length;
    if (e.key === 'ArrowDown' && open) { e.preventDefault(); acIdx = (acIdx + 1) % acItems.length; acPaint(); return; }
    if (e.key === 'ArrowUp' && open) { e.preventDefault(); acIdx = (acIdx - 1 + acItems.length) % acItems.length; acPaint(); return; }
    if ((e.key === 'Enter' || e.key === 'Tab') && open && acIdx >= 0) { e.preventDefault(); acPick(acIdx); return; }
    if (e.key === 'Escape' && box) { box.hidden = true; return; }
  }
  if (!$('#modal').classList.contains('hidden')) return;
  if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); const n = addDays(cur, e.key === 'ArrowLeft' ? -1 : 1); if (n <= todayKey()) { cur = n; render(); } return; }
  if (e.key === '/' && !typing) { e.preventDefault(); ACT.quick(); }
});
// infobulles des graphiques
document.addEventListener('mousemove', e => {
  const tip = $('#tip'), el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.style.display = 'none'; return; }
  tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block';
  const r = tip.getBoundingClientRect(); let x = e.clientX + 12, y = e.clientY - r.height - 10;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12; if (y < 8) y = e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
// glisser-déposer des photos
document.addEventListener('dragover', e => { if (view !== 'photos' || !e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); });
document.addEventListener('dragleave', e => { if (e.target.id === 'drop' || !e.relatedTarget) { const d = $('#drop'); if (d) d.classList.remove('over'); } });
document.addEventListener('drop', e => { if (view !== 'photos') return; e.preventDefault(); const d = $('#drop'); if (d) d.classList.remove('over'); if (e.dataTransfer && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });

let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { const a = document.activeElement; if (!a || a === document.body) render(); }, 250); });
window.addEventListener('hashchange', () => { editFoodId = null; foodFilter = ''; render(); window.scrollTo(0, 0); });
let lastToday = todayKey();
setInterval(() => { const t = todayKey(); if (t !== lastToday) { if (cur === lastToday) cur = t; lastToday = t; if (!document.activeElement || document.activeElement === document.body) render(); } }, 60000);

boot();
</script>
